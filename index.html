<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Oliver's Lagoon</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%A2%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --p1:#ff5722; --p2:#7c3aed; --p3:#0ea5e9; --p4:#22c55e;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
    min-height:100vh;
    color:#fff;
    text-align:center;
    background:linear-gradient(120deg,var(--p1),var(--p2),var(--p3),var(--p4));
    background-size:400% 400%;
    animation:flow 16s ease infinite;
    padding:24px 14px 50px;
    overflow-x:hidden;
  }
  @keyframes flow{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}

  h1{
    font-size:clamp(1.9rem,8vw,2.8rem);
    text-shadow:3px 3px 0 rgba(0,0,0,0.2);
    animation:pop 2.5s ease-in-out infinite;
  }
  @keyframes pop{0%,100%{transform:scale(1) rotate(-1deg);}50%{transform:scale(1.04) rotate(1deg);}}
  .sub{font-size:clamp(0.95rem,3.5vw,1.15rem); margin:4px 0 16px; text-shadow:1px 1px 0 rgba(0,0,0,0.15);}

  .screen{display:none;}
  .screen.active{display:block;}

  /* ---- my photo picker ---- */
  .my-photo-row{display:flex; flex-direction:column; align-items:center; gap:4px; margin-bottom:16px;}
  .my-photo-btn{
    width:64px; height:64px; border-radius:50%; border:4px solid #fff; background:rgba(255,255,255,0.25);
    cursor:pointer; overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:1.8rem;
    box-shadow:0 4px 0 rgba(0,0,0,0.2);
  }
  .my-photo-btn:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,0.2);}
  .my-photo-btn img{width:100%; height:100%; object-fit:cover;}
  .my-photo-label{font-size:0.68rem; opacity:0.9; text-shadow:1px 1px 0 rgba(0,0,0,0.15);}

  /* ---- park map ---- */
  .park-map{
    position:relative; max-width:460px; aspect-ratio:1/1; margin:0 auto;
    background:linear-gradient(160deg,#9be89b,#6fcf6f);
    border:5px solid #fff; border-radius:28px; overflow:hidden;
    box-shadow:0 8px 0 rgba(0,0,0,0.2);
  }
  .lagoon-water{
    position:absolute; left:50%; top:53%; width:46%; height:34%; transform:translate(-50%,-50%);
    background:radial-gradient(circle at 35% 30%, #7fd8f5, #1d8fc9);
    border-radius:50% 45% 55% 50% / 55% 50% 50% 45%;
    box-shadow:inset 0 0 14px rgba(0,0,0,0.2);
  }
  .park-tree{position:absolute; font-size:1.5rem; filter:drop-shadow(0 2px 1px rgba(0,0,0,0.2));}

  /* ---- lagoon-a-beach button + map ---- */
  .beach-btn-row{margin-bottom:16px;}
  .beach-btn{
    font-family:inherit; font-weight:bold; font-size:0.9rem; border:3px solid #fff; border-radius:999px;
    padding:10px 20px; cursor:pointer; background:rgba(255,255,255,0.22); color:#fff;
    box-shadow:0 4px 0 rgba(0,0,0,0.2); transition:transform .08s ease;
  }
  .beach-btn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,0.2);}
  .park-map.beach-map{background:linear-gradient(160deg,#fde68a,#f6c453);}
  .beach-pool{
    position:absolute; left:50%; top:50%; width:56%; height:40%; transform:translate(-50%,-50%);
    background:radial-gradient(circle at 35% 30%, #7fe3f5, #0e8fbf);
    border-radius:48% 52% 45% 55% / 55% 45% 55% 45%;
    box-shadow:inset 0 0 16px rgba(0,0,0,0.2);
  }
  .ride-pin{
    position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:2px;
    background:none; border:none; cursor:pointer; padding:0;
  }
  .ride-pin:active{transform:translate(-50%,-50%) scale(0.9);}
  .ride-pin-icon{
    width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center;
    font-size:1.5rem; box-shadow:0 3px 0 rgba(0,0,0,0.3); border:2px solid #fff;
  }
  .ride-pin-label{
    font-size:0.44rem; font-weight:bold; color:#1f2937; background:rgba(255,255,255,0.92); border-radius:6px;
    padding:1px 4px; white-space:nowrap; line-height:1.3; max-width:70px; overflow:hidden; text-overflow:ellipsis;
  }

  /* ---- on-ride view ---- */
  .ride-view{
    max-width:420px; margin:10px auto 0; background:rgba(0,0,0,0.28); border:4px solid #fff; border-radius:28px;
    padding:34px 20px; min-height:300px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
  }
  .ride-view.shaking .ride-scene{animation:rideShake 0.35s ease-in-out infinite;}
  @keyframes rideShake{
    0%,100%{transform:translate(0,0) rotate(0deg);}
    25%{transform:translate(-5px,3px) rotate(-3deg);}
    50%{transform:translate(4px,-4px) rotate(3deg);}
    75%{transform:translate(-3px,-3px) rotate(-2deg);}
  }
  .ride-scene{display:flex; flex-direction:column; align-items:center;}
  .ride-canvas-wrap{
    position:relative; width:100%; max-width:380px; border-radius:18px; overflow:hidden;
    border:4px solid #fff; box-shadow:0 6px 0 rgba(0,0,0,0.3); line-height:0;
  }
  #rideCanvas{width:100%; height:auto; display:block; position:relative; z-index:1;}
  .ride-photo-bg{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none;
  }
  .ride-photo-bg.show{display:block;}
  .ride-video-wrap{
    position:relative; width:100%; max-width:380px; aspect-ratio:16/9; border-radius:18px; overflow:hidden;
    border:4px solid #fff; box-shadow:0 6px 0 rgba(0,0,0,0.3); background:#000;
  }
  .ride-video-wrap iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}
  .video-thumb{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none;}
  .video-thumb.show{display:block;}
  .video-play-btn{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:2; display:none;
    width:72px; height:72px; border-radius:50%; border:5px solid #fff; background:#ff5c5c; color:#fff;
    font-size:1.8rem; cursor:pointer; box-shadow:0 6px 0 rgba(0,0,0,0.35); transition:transform .08s ease;
    align-items:center; justify-content:center; padding-left:6px;
  }
  .video-play-btn.show{display:flex;}
  .video-play-btn:active{transform:translate(-50%,-50%) translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,0.35);}
  .photo-credit{
    font-size:0.62rem; opacity:0.75; margin-top:4px; text-shadow:1px 1px 0 rgba(0,0,0,0.15); min-height:1em;
  }
  .ride-emo-badge{
    position:absolute; top:6px; left:8px; font-size:1.6rem; margin-top:0;
    filter:drop-shadow(0 3px 0 rgba(0,0,0,0.4)); transition:transform 0.15s ease;
  }
  .ride-emo-badge.screaming{animation:emoScream 0.22s ease-in-out infinite;}
  @keyframes emoScream{
    0%,100%{transform:scale(1.3) rotate(-4deg);}
    50%{transform:scale(1.65) rotate(4deg);}
  }
  .ride-phase-text{font-size:1.1rem; font-weight:bold; text-shadow:2px 2px 0 rgba(0,0,0,0.2); min-height:2.6em; display:flex; align-items:center; justify-content:center;}
  .ride-view-name{font-size:1rem; opacity:0.85; margin-top:-8px;}
  .ride-done-row{display:flex; gap:12px; flex-wrap:wrap; justify-content:center;}
  .ride-btn{
    font-family:inherit; font-weight:bold; font-size:0.95rem; border:none; border-radius:16px; padding:12px 20px;
    cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,0.2); transition:transform .08s ease; color:#38314f;
  }
  .ride-btn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,0.2);}
  .ride-btn.again{background:#fff;}
  .ride-btn.back{background:rgba(255,255,255,0.55);}

  /* ---- camera / photo-choice modal ---- */
  .camera-modal{
    position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,0.75); padding:20px;
  }
  .camera-modal.show{display:flex;}
  .camera-card{
    background:#241a3d; border:4px solid #fff; border-radius:24px; padding:16px; max-width:340px; width:100%;
    display:flex; flex-direction:column; align-items:center; gap:12px;
  }
  .camera-close-btn{align-self:flex-end; background:none; border:none; color:#fff; font-size:1.3rem; cursor:pointer; margin:-8px -8px 0 0;}
  .camera-msg{color:#fff; font-size:0.85rem; font-weight:bold; margin-top:-8px;}
  .camera-video{width:100%; max-width:260px; border-radius:16px; background:#000; aspect-ratio:1/1; object-fit:cover; display:none;}
  .camera-btn-row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}

  footer{margin-top:26px; font-size:0.8rem; opacity:0.9; text-shadow:1px 1px 0 rgba(0,0,0,0.12);}
</style>
</head>
<body>
  <h1>🌴 Oliver's Lagoon</h1>
  <p class="sub">Tap a ride on the map to go on it!</p>

  <!-- ==== PARK MAP ==== -->
  <div class="screen active" id="screen-park">
    <div class="my-photo-row">
      <button class="my-photo-btn" id="myPhotoBtn"><span id="myPhotoPreview">📸</span></button>
      <div class="my-photo-label">Tap for your photo!</div>
      <!-- No accept="image/*" filter — some real photo formats (like iPhone
           HEIC photos) aren't always recognized by that filter on every
           OS/browser, which can hide real photos from the picker entirely.
           shrinkImageFile()'s onerror fallback below handles a non-image
           file being picked by mistake with a friendly message instead. -->
      <input type="file" id="myPhotoInput" style="display:none;">
    </div>
    <div class="beach-btn-row">
      <button class="beach-btn" id="goToBeachBtn">🏖️ Lagoon-A-Beach</button>
    </div>
    <div class="park-map" id="parkMap">
      <div class="lagoon-water"></div>
      <span class="park-tree" style="left:4%; top:5%;">🌴</span>
      <span class="park-tree" style="left:95%; top:5%;">🌴</span>
      <span class="park-tree" style="left:4%; top:95%;">🌴</span>
      <span class="park-tree" style="left:95%; top:95%;">🌴</span>
      <div id="ridePinsLayer"></div>
    </div>
  </div>

  <!-- ==== LAGOON-A-BEACH MAP ==== -->
  <div class="screen" id="screen-beach">
    <div class="beach-btn-row">
      <button class="beach-btn" id="goToParkBtn">🎢 Back to the Park</button>
    </div>
    <div class="park-map beach-map" id="beachMap">
      <div class="beach-pool"></div>
      <span class="park-tree" style="left:4%; top:5%;">🌴</span>
      <span class="park-tree" style="left:95%; top:5%;">☀️</span>
      <span class="park-tree" style="left:4%; top:95%;">🏖️</span>
      <span class="park-tree" style="left:95%; top:95%;">🌴</span>
      <div id="beachPinsLayer"></div>
    </div>
  </div>

  <!-- ==== ON-RIDE VIEW ==== -->
  <div class="screen" id="screen-ride">
    <div class="ride-view" id="rideView">
      <div class="ride-view-name" id="rideViewName">Ride Name</div>
      <div class="ride-scene">
        <div class="ride-canvas-wrap" id="rideCanvasWrap">
          <img class="ride-photo-bg" id="ridePhotoBg" alt="">
          <canvas id="rideCanvas" width="380" height="190"></canvas>
          <div class="ride-emo-badge" id="rideBigEmo">🎢</div>
        </div>
        <div class="ride-video-wrap" id="rideVideoWrap" style="display:none;">
          <img class="video-thumb" id="rideVideoThumb" alt="">
          <button class="video-play-btn" id="videoPlayBtn">▶️</button>
          <iframe id="rideVideoFrame" src="" title="Real ride video" frameborder="0" style="display:none;"
            allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>
        <div class="photo-credit" id="photoCredit"></div>
      </div>
      <div class="ride-phase-text" id="ridePhaseText">Getting ready...</div>
      <div class="ride-done-row" id="rideDoneRow" style="display:none;">
        <button class="ride-btn again" id="rideAgainBtn">🔁 Ride Again</button>
        <button class="ride-btn back" id="rideBackBtn">🏠 Back to Park</button>
      </div>
    </div>
  </div>

  <!-- ==== PHOTO CHOICE / CAMERA MODAL ==== -->
  <div class="camera-modal" id="cameraModal">
    <div class="camera-card">
      <button class="camera-close-btn" id="closeCameraModalBtn">✕</button>
      <div class="camera-msg" id="cameraMsg">How do you want to add your photo?</div>
      <video class="camera-video" id="cameraVideo" autoplay playsinline muted></video>
      <div class="camera-btn-row" id="cameraChoiceRow">
        <button class="ride-btn again" id="takeNewPhotoBtn">📷 Take a New Photo</button>
        <button class="ride-btn back" id="chooseFileBtn">🗂️ Choose Existing Photo</button>
      </div>
      <div class="camera-btn-row" id="cameraCaptureRow" style="display:none;">
        <button class="ride-btn again" id="captureBtn">📸 Snap It!</button>
        <button class="ride-btn back" id="cancelCameraBtn">Cancel</button>
      </div>
    </div>
  </div>

  <footer>Made for Oliver 🎢</footer>

<script>
// ---------- audio ----------
let audioCtx;
function ctx(){
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function tone(freq, start, dur, type, gainMax){
  const c = ctx();
  const osc = c.createOscillator();
  const gain = c.createGain();
  osc.type = type || "sine";
  osc.frequency.setValueAtTime(freq, c.currentTime + start);
  gain.gain.setValueAtTime(0, c.currentTime + start);
  gain.gain.linearRampToValueAtTime(gainMax || 0.15, c.currentTime + start + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + start + dur);
  osc.connect(gain).connect(c.destination);
  osc.start(c.currentTime + start);
  osc.stop(c.currentTime + start + dur + 0.05);
}
function slideTone(fromFreq, toFreq, start, dur, gainMax){
  const c = ctx();
  const osc = c.createOscillator();
  const gain = c.createGain();
  osc.type = "sawtooth";
  osc.frequency.setValueAtTime(fromFreq, c.currentTime + start);
  osc.frequency.linearRampToValueAtTime(toFreq, c.currentTime + start + dur);
  gain.gain.setValueAtTime(0, c.currentTime + start);
  gain.gain.linearRampToValueAtTime(gainMax || 0.12, c.currentTime + start + 0.03);
  gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + start + dur);
  osc.connect(gain).connect(c.destination);
  osc.start(c.currentTime + start);
  osc.stop(c.currentTime + start + dur + 0.05);
}

// ---------- my photo (stored locally on this device only) ----------
const PHOTO_KEY = "lagoon_my_photo";
function loadMyPhoto(){ try { return localStorage.getItem(PHOTO_KEY); } catch (e){ return null; } }
// No try/catch here — a save failure needs to reach the caller so it can
// tell Oliver, not disappear silently (see the bug this fixed, below).
function saveMyPhoto(dataUrl){ localStorage.setItem(PHOTO_KEY, dataUrl); }

// A real camera photo is several MB — as a base64 data URL that's often
// 5MB+, which blows past localStorage's ~5MB-per-site quota and used to
// fail completely silently (saveMyPhoto swallowed the error, so tapping
// the button to take a photo just... did nothing, with no clue why).
// Shrinking to a small square JPEG first keeps it to a few KB regardless
// of camera resolution, so it always fits.
function shrinkImageFile(file, maxSize, callback){
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = () => {
    const canvas = document.createElement("canvas");
    canvas.width = maxSize;
    canvas.height = maxSize;
    const g = canvas.getContext("2d");
    const side = Math.min(img.naturalWidth, img.naturalHeight);
    const sx = (img.naturalWidth - side) / 2;
    const sy = (img.naturalHeight - side) / 2;
    g.drawImage(img, sx, sy, side, side, 0, 0, maxSize, maxSize);
    URL.revokeObjectURL(url);
    callback(canvas.toDataURL("image/jpeg", 0.8));
  };
  img.onerror = () => { URL.revokeObjectURL(url); callback(null); };
  img.src = url;
}

function renderMyPhotoPreview(){
  const el = document.getElementById("myPhotoPreview");
  const photo = loadMyPhoto();
  el.innerHTML = photo ? `<img src="${photo}" alt="Me">` : "📸";
}
function finishPhotoSave(dataUrl){
  if (!dataUrl){
    alert("Hmm, that photo didn't work — try again!");
    return;
  }
  try {
    saveMyPhoto(dataUrl);
  } catch (err) {
    alert("That photo couldn't be saved — try again!");
    return;
  }
  renderMyPhotoPreview();
  tone(700, 0, 0.1, "sine", 0.12);
  tone(900, 0.1, 0.15, "sine", 0.12);
}

document.getElementById("myPhotoInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  e.target.value = ""; // so picking the same file again later still fires "change"
  if (!file) return;
  shrinkImageFile(file, 240, finishPhotoSave);
});

// ---------- take-a-new-photo (webcam) ----------
// For when there's no existing photo file on the device at all — lets Oliver
// take a brand new one right in the browser instead, using the computer's
// (or phone's) camera directly.
let cameraStream = null;

function resetPhotoModal(){
  document.getElementById("cameraMsg").textContent = "How do you want to add your photo?";
  document.getElementById("cameraChoiceRow").style.display = "flex";
  document.getElementById("cameraCaptureRow").style.display = "none";
  document.getElementById("cameraVideo").style.display = "none";
}
function stopCameraStream(){
  if (cameraStream){
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
}
function openPhotoModal(){
  resetPhotoModal();
  document.getElementById("cameraModal").classList.add("show");
}
function closePhotoModal(){
  document.getElementById("cameraModal").classList.remove("show");
  stopCameraStream();
}

document.getElementById("myPhotoBtn").addEventListener("click", () => {
  tone(600, 0, 0.1, "triangle", 0.1);
  openPhotoModal();
});
document.getElementById("closeCameraModalBtn").addEventListener("click", closePhotoModal);
document.getElementById("cancelCameraBtn").addEventListener("click", closePhotoModal);
document.getElementById("cameraModal").addEventListener("click", (e) => {
  if (e.target.id === "cameraModal") closePhotoModal();
});

document.getElementById("chooseFileBtn").addEventListener("click", () => {
  closePhotoModal();
  document.getElementById("myPhotoInput").click();
});

document.getElementById("takeNewPhotoBtn").addEventListener("click", async () => {
  const video = document.getElementById("cameraVideo");
  const msg = document.getElementById("cameraMsg");
  document.getElementById("cameraChoiceRow").style.display = "none";
  msg.textContent = "Starting the camera...";
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    msg.textContent = "This browser can't use a camera. Try 'Choose Existing Photo' instead!";
    document.getElementById("cameraChoiceRow").style.display = "flex";
    return;
  }
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
    video.srcObject = cameraStream;
    video.style.display = "block";
    msg.textContent = "Say cheese! 📷";
    document.getElementById("cameraCaptureRow").style.display = "flex";
  } catch (err) {
    msg.textContent = "No camera found (or it was blocked). Try 'Choose Existing Photo' instead!";
    document.getElementById("cameraChoiceRow").style.display = "flex";
  }
});

document.getElementById("captureBtn").addEventListener("click", () => {
  const video = document.getElementById("cameraVideo");
  const size = 240;
  const canvas = document.createElement("canvas");
  canvas.width = size;
  canvas.height = size;
  const g = canvas.getContext("2d");
  const side = Math.min(video.videoWidth, video.videoHeight);
  const sx = (video.videoWidth - side) / 2;
  const sy = (video.videoHeight - side) / 2;
  g.drawImage(video, sx, sy, side, side, 0, 0, size, size);
  finishPhotoSave(canvas.toDataURL("image/jpeg", 0.85));
  closePhotoModal();
});

renderMyPhotoPreview();

// =====================================================================
// ---------- ride-through visual engine ----------
// Real animated rides instead of a static photo badge: each ride has an
// `engine` ("track"/"wheel"/"swing"/"drive") that drives its own canvas
// animation, built to evoke the real Lagoon attraction's actual shape —
// Colossus/Wicked/Cannibal reuse the exact researched track data from the
// Coaster Party app (same RCDB-grounded Cannibal element sequence, Wicked's
// tunnel-launch, Colossus's long wooden-coaster profile); the rest are
// shaped from real facts (BomBora's gentle 45ft rolling hills, Rattlesnake
// Rapids' spinning raft, Tidal Wave's ~70ft plunge, SkyCoaster's winch-then-
// pendulum-swing, Wild Kingdom's actual train-past-animals loop) — not a
// literal survey trace, just a genuine best effort at the real feel within
// a simple canvas.
// =====================================================================

function noLoops(len){ return new Array(len).fill(false); }
function loopsAt(idxs, len){ var a = noLoops(len); idxs.forEach(function (i) { a[i] = true; }); return a; }

const RIDE_CANVAS_W = 380, RIDE_CANVAS_H = 190;
const TRACK_STEP = 15, TRACK_UNIT_H = 6.2, TRACK_GROUND_Y = 150, TRACK_LOOP_RADIUS = 15;
const RIDE_BASE_SPEED = 3.2, RIDE_SLOPE_FACTOR = 1.4, RIDE_MIN_SPEED = 1.2, RIDE_MAX_SPEED = 6.5;

function clampNum(n, lo, hi){ return Math.max(lo, Math.min(hi, n)); }

// Deterministic timeline from a heights array — downhill is fast, uphill is
// slow, same speed model as Coaster Party (not that sync matters here with
// no multiplayer, but it's a proven, good-feeling pacing curve).
function buildRideTimeline(heights){
  const times = [0];
  for (let i = 1; i < heights.length; i++){
    const slope = heights[i] - heights[i - 1];
    const speed = clampNum(RIDE_BASE_SPEED - slope * RIDE_SLOPE_FACTOR, RIDE_MIN_SPEED, RIDE_MAX_SPEED);
    times.push(times[i - 1] + 1 / speed);
  }
  return times;
}
function getRideProgress(timeline, elapsedSec){
  const n = timeline.length;
  if (elapsedSec >= timeline[n - 1]) return { done:true, col:n - 1, nextCol:n - 1, frac:1 };
  let i = 0;
  while (i < n - 2 && timeline[i + 1] <= elapsedSec) i++;
  const segStart = timeline[i], segEnd = timeline[i + 1];
  const frac = segEnd > segStart ? (elapsedSec - segStart) / (segEnd - segStart) : 0;
  return { done:false, col:i, nextCol:i + 1, frac:frac };
}

function trackWorldX(col){ return col * TRACK_STEP; }
function trackWorldY(h){ return TRACK_GROUND_Y - h * TRACK_UNIT_H; }
// Loops are a pure rendering override on top of the normal linear position —
// if the linear x falls within a loop column's radius, trace a circle
// instead, driven by that same linear x (so timing is completely unaffected).
function applyTrackLoopOverride(x, y, heights, loops){
  if (!loops) return { x:x, y:y, angle:0 };
  for (let li = 0; li < loops.length; li++){
    if (!loops[li] || heights[li] == null) continue;
    const centerX = trackWorldX(li);
    if (Math.abs(x - centerX) > TRACK_LOOP_RADIUS) continue;
    const centerY = trackWorldY(heights[li]) - TRACK_LOOP_RADIUS;
    const phase = clampNum((x - (centerX - TRACK_LOOP_RADIUS)) / (2 * TRACK_LOOP_RADIUS), 0, 1);
    const theta = phase * Math.PI * 2;
    return { x:centerX + Math.sin(theta) * TRACK_LOOP_RADIUS, y:centerY + Math.cos(theta) * TRACK_LOOP_RADIUS, angle:theta };
  }
  return { x:x, y:y, angle:0 };
}

const RIDE_THEMES = {
  coaster: { skyTop:"#3fa9d9", skyBottom:"#bfe8ff", ground:"#7fb955", track:"#8a5a3a", cabin:"#ff5722" },
  water:   { skyTop:"#4fb8d9", skyBottom:"#cdeffa", ground:"#1d8fc9", track:"#0369a1", cabin:"#0ea5e9" },
  splash:  { skyTop:"#3fa0d9", skyBottom:"#bfe8ff", ground:"#1d8fc9", track:"#0284c7", cabin:"#0284c7" },
};

// ---- the riders: the kid's own photo (if set) plus a couple of computer
// people along for the ride, so the cart never feels empty. Picked fresh
// each time a ride starts (not re-randomized every frame). ----
const NPC_RIDER_COLORS = ["#ff6b6b", "#4dd0e1", "#ffd54f", "#a78bfa", "#f472b6"];
const NPC_RIDER_FACES = ["😄", "😆", "🙃", "😎", "🤩", "😁"];
function pickNpcRiders(){
  const count = 2 + Math.floor(Math.random() * 2); // 2 or 3 computer riders
  const riders = [];
  for (let i = 0; i < count; i++){
    riders.push({
      color: NPC_RIDER_COLORS[Math.floor(Math.random() * NPC_RIDER_COLORS.length)],
      face: NPC_RIDER_FACES[Math.floor(Math.random() * NPC_RIDER_FACES.length)],
    });
  }
  return riders;
}
var currentNpcRiders = []; // var (not let) so jsdom tests can reach it via window.currentNpcRiders
let currentPlayerPhotoImg = null;
function loadPlayerPhotoImage(){
  currentPlayerPhotoImg = null;
  const dataUrl = loadMyPhoto();
  if (!dataUrl) return;
  const img = new Image();
  img.onload = () => { currentPlayerPhotoImg = img; };
  img.src = dataUrl;
}

function roundRectPath(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function drawRiderSeat(ctx, x, y, npc){
  ctx.save();
  ctx.translate(x, y);
  ctx.beginPath();
  ctx.arc(0, 0, 7, 0, Math.PI * 2);
  if (!npc && currentPlayerPhotoImg){
    ctx.save();
    ctx.clip();
    ctx.drawImage(currentPlayerPhotoImg, -7, -7, 14, 14);
    ctx.restore();
  } else {
    ctx.fillStyle = npc ? npc.color : "#fff";
    ctx.fill();
    ctx.font = "9px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(npc ? npc.face : "🙂", 0, 1);
  }
  ctx.restore();
}
// The cart/raft/gondola/jeep itself — a small rounded cabin holding the
// player + every NPC rider in a row, so "you" are always visibly one of
// several people riding together, not alone.
function drawVehicleWithRiders(ctx, x, y, angle, cabinColor){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate((angle || 0) * 0.25);
  const seatCount = 1 + currentNpcRiders.length;
  const w = 15 * seatCount + 10;
  ctx.fillStyle = cabinColor || "#ffcf4d";
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 2;
  roundRectPath(ctx, -w / 2, -5, w, 22, 7);
  ctx.fill(); ctx.stroke();
  const startX = -((seatCount - 1) * 16) / 2;
  drawRiderSeat(ctx, startX, 6, null);
  currentNpcRiders.forEach((r, i) => drawRiderSeat(ctx, startX + (i + 1) * 16, 6, r));
  ctx.restore();
}

// ---- track engine: coasters, flumes, splash rides, spinning rafts ----
// For rides with a real photo backdrop: skip the drawn sky/ground/track
// entirely (the real photo already shows the real thing) and just animate
// the cart + riders in a simple climb-and-crest arc over the image — no
// attempt to pixel-align with the photo's own geometry, just motion.
function drawPhotoRideOverlay(ctx, ride, elapsedSec){
  ctx.clearRect(0, 0, RIDE_CANVAS_W, RIDE_CANVAS_H);
  const duration = 6;
  const t = (elapsedSec % duration) / duration;
  const x = 40 + t * (RIDE_CANVAS_W - 80);
  const y = RIDE_CANVAS_H - 40 - Math.sin(t * Math.PI) * (RIDE_CANVAS_H - 90);
  const angle = Math.cos(t * Math.PI) * 0.6;
  const theme = RIDE_THEMES[ride.theme] || RIDE_THEMES.coaster;
  drawVehicleWithRiders(ctx, x, y, angle, theme.cabin);
}

function drawTrackRide(ctx, ride, elapsedSec){
  const theme = RIDE_THEMES[ride.theme] || RIDE_THEMES.coaster;
  const totalDur = ride._timeline[ride._timeline.length - 1];
  const t = totalDur > 0 ? elapsedSec % totalDur : 0;
  const prog = getRideProgress(ride._timeline, t);
  const heights = ride.heights, loops = ride.loops || noLoops(heights.length);

  const inTunnel = ride.tunnelCols > 0 && prog.col < ride.tunnelCols;
  if (inTunnel){
    ctx.fillStyle = "#0c0c16";
    ctx.fillRect(0, 0, RIDE_CANVAS_W, RIDE_CANVAS_H);
  } else {
    const grad = ctx.createLinearGradient(0, 0, 0, RIDE_CANVAS_H);
    grad.addColorStop(0, theme.skyTop); grad.addColorStop(1, theme.skyBottom);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, RIDE_CANVAS_W, RIDE_CANVAS_H);
  }

  let cartWX = trackWorldX(prog.col) + (trackWorldX(prog.nextCol) - trackWorldX(prog.col)) * prog.frac;
  let cartWY = trackWorldY(heights[prog.col]) + (trackWorldY(heights[prog.nextCol]) - trackWorldY(heights[prog.col])) * prog.frac;
  let slopeAngle = Math.atan2(trackWorldY(heights[prog.nextCol]) - trackWorldY(heights[prog.col]), TRACK_STEP);
  const looped = applyTrackLoopOverride(cartWX, cartWY, heights, loops);
  cartWX = looped.x; cartWY = looped.y;
  if (looped.angle) slopeAngle = looped.angle;

  const cameraX = clampNum(cartWX - RIDE_CANVAS_W / 2, 0, Math.max(0, trackWorldX(heights.length - 1) - RIDE_CANVAS_W + TRACK_STEP));
  const cameraY = Math.min(0, cartWY - RIDE_CANVAS_H * 0.55);

  ctx.save();
  ctx.translate(-cameraX, -cameraY);

  ctx.fillStyle = theme.ground;
  ctx.fillRect(cameraX - 40, TRACK_GROUND_Y + 6, RIDE_CANVAS_W + 80, 200);

  ctx.strokeStyle = theme.track;
  ctx.lineWidth = 4;
  ctx.beginPath();
  for (let i = 0; i < heights.length - 1; i++){
    const x1 = trackWorldX(i), y1 = trackWorldY(heights[i]);
    const x2 = trackWorldX(i + 1), y2 = trackWorldY(heights[i + 1]);
    if (i === 0) ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
  }
  ctx.stroke();
  loops.forEach((isLoop, li) => {
    if (!isLoop) return;
    const cx = trackWorldX(li), cy = trackWorldY(heights[li]) - TRACK_LOOP_RADIUS;
    ctx.beginPath();
    ctx.arc(cx, cy, TRACK_LOOP_RADIUS, 0, Math.PI * 2);
    ctx.stroke();
  });

  // Rattlesnake Rapids-style rafts spin freely as they float, independent
  // of the track's own slope angle.
  const vehicleAngle = ride.spinning ? elapsedSec * 2.4 : slopeAngle;
  drawVehicleWithRiders(ctx, cartWX, cartWY, vehicleAngle, theme.cabin);

  ctx.restore();

  if (inTunnel){
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("🚇 Launching...", RIDE_CANVAS_W / 2, 24);
  }
}

// ---- wheel engine: Ferris Wheel ----
const WHEEL_LAP_SEC = 9;
function drawWheelRide(ctx, ride, elapsedSec){
  const grad = ctx.createLinearGradient(0, 0, 0, RIDE_CANVAS_H);
  grad.addColorStop(0, "#4fc3f7"); grad.addColorStop(1, "#bfe8ff");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, RIDE_CANVAS_W, RIDE_CANVAS_H);
  ctx.fillStyle = "#8fd68f";
  ctx.fillRect(0, RIDE_CANVAS_H - 22, RIDE_CANVAS_W, 22);

  const cx = RIDE_CANVAS_W / 2, cy = RIDE_CANVAS_H - 66, radius = 62;
  const angle = (elapsedSec / WHEEL_LAP_SEC) * Math.PI * 2;

  ctx.strokeStyle = "#ec4899";
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.stroke();
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 2;
  for (let i = 0; i < 8; i++){
    const a = i * (Math.PI * 2 / 8);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a) * radius, cy + Math.sin(a) * radius);
    ctx.stroke();
  }
  const gx = cx + Math.cos(angle - Math.PI / 2) * radius;
  const gy = cy + Math.sin(angle - Math.PI / 2) * radius;
  drawVehicleWithRiders(ctx, gx, gy, 0, "#ec4899");
}

// ---- swing engine: SkyCoaster (winched up, then a big decaying pendulum swing) ----
const SWING_WINCH_SEC = 3.5, SWING_CYCLE_SEC = 10;
function drawSwingRide(ctx, ride, elapsedSecRaw){
  const elapsedSec = elapsedSecRaw % SWING_CYCLE_SEC;
  const grad = ctx.createLinearGradient(0, 0, 0, RIDE_CANVAS_H);
  grad.addColorStop(0, "#2b6cb0"); grad.addColorStop(1, "#bfe8ff");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, RIDE_CANVAS_W, RIDE_CANVAS_H);
  ctx.fillStyle = "#8fd68f";
  ctx.fillRect(0, RIDE_CANVAS_H - 18, RIDE_CANVAS_W, 18);

  const towerX = RIDE_CANVAS_W / 2, towerTopY = 16, groundY = RIDE_CANVAS_H - 18;
  ctx.strokeStyle = "#94a3b8";
  ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(towerX - 60, groundY); ctx.lineTo(towerX - 6, towerTopY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(towerX + 60, groundY); ctx.lineTo(towerX + 6, towerTopY); ctx.stroke();

  const pivotX = towerX, pivotY = towerTopY;
  const swingLen = groundY - towerTopY - 24;
  let riderX, riderY;
  if (elapsedSec < SWING_WINCH_SEC){
    const p = elapsedSec / SWING_WINCH_SEC;
    riderX = pivotX;
    riderY = groundY - p * (groundY - towerTopY - 30);
  } else {
    const t = elapsedSec - SWING_WINCH_SEC;
    const amp = Math.max(0.15, 1.3 - t * 0.18);
    const theta = Math.sin(t * 1.6) * amp;
    riderX = pivotX + Math.sin(theta) * swingLen;
    riderY = pivotY + Math.cos(theta) * swingLen;
  }
  ctx.strokeStyle = "#e2e8f0";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(pivotX, pivotY); ctx.lineTo(riderX, riderY); ctx.stroke();

  const swingAngle = Math.atan2(riderX - pivotX, riderY - pivotY);
  drawVehicleWithRiders(ctx, riderX, riderY, swingAngle * 0.6, "#38bdf8");
}

// ---- drive engine: Wild Kingdom's real train-past-animals loop, Lazy River ----
function drawDriveRide(ctx, ride, elapsedSec){
  const isWater = ride.theme === "water";
  const grad = ctx.createLinearGradient(0, 0, 0, RIDE_CANVAS_H);
  grad.addColorStop(0, "#bfe8ff"); grad.addColorStop(1, isWater ? "#7ecbe0" : "#bde68a");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, RIDE_CANVAS_W, RIDE_CANVAS_H);
  ctx.fillStyle = isWater ? "#1d8fc9" : "#7fb955";
  ctx.fillRect(0, RIDE_CANVAS_H * 0.62, RIDE_CANVAS_W, RIDE_CANVAS_H * 0.4);

  // Wild Kingdom's real ride goes through a tunnel partway around its loop.
  const cycle = 9;
  const cyclePos = (elapsedSec % cycle) / cycle;
  const inTunnel = !!ride.hasTunnel && cyclePos > 0.55 && cyclePos < 0.75;
  if (inTunnel){
    ctx.fillStyle = "rgba(10,10,20,0.85)";
    ctx.fillRect(0, 0, RIDE_CANVAS_W, RIDE_CANVAS_H);
  }

  const scenery = ride.scenery || ["🌳"];
  const spacing = 110;
  const offset = (elapsedSec * 70) % (spacing * scenery.length);
  ctx.font = "28px sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.globalAlpha = inTunnel ? 0.15 : 1;
  for (let pass = 0; pass < 2; pass++){
    scenery.forEach((emo, i) => {
      const baseX = i * spacing - offset + pass * spacing * scenery.length;
      if (baseX > -60 && baseX < RIDE_CANVAS_W + 60) ctx.fillText(emo, baseX, RIDE_CANVAS_H * 0.6);
    });
  }
  ctx.globalAlpha = 1;

  drawVehicleWithRiders(ctx, RIDE_CANVAS_W * 0.3, RIDE_CANVAS_H * 0.68, 0, isWater ? "#0d9488" : "#65a30d");
}

let rideVisualAnimId = null;
let rideVisualStartPerf = 0;
let rideCanvasCtx = null;
// Builds a privacy-friendly (youtube-nocookie.com) embed URL for a ride's
// real on-ride video. rel=0 cuts down on unrelated suggested videos.
// autoplay=1 only matters once this loads from a genuine tap on the play
// button — browsers block autoplay otherwise, so it wouldn't do anything if
// set at ride-start time before the kid has actually interacted with it.
function youtubeEmbedUrl(youtubeId, autoplay){
  return "https://www.youtube-nocookie.com/embed/" + youtubeId + "?rel=0" + (autoplay ? "&autoplay=1" : "");
}
// A real, reliable thumbnail image for a YouTube video, no API/key needed.
function youtubeThumbUrl(youtubeId){
  return "https://i.ytimg.com/vi/" + youtubeId + "/hqdefault.jpg";
}

function initRideVisual(ride){
  const canvasWrapEl = document.getElementById("rideCanvasWrap");
  const videoWrapEl = document.getElementById("rideVideoWrap");
  const videoFrameEl = document.getElementById("rideVideoFrame");
  const videoThumbEl = document.getElementById("rideVideoThumb");
  const playBtnEl = document.getElementById("videoPlayBtn");
  const creditEl = document.getElementById("photoCredit");

  // A real video takes priority over everything else — it's the most
  // authentic option, so the drawn/photo canvas visuals aren't shown at all
  // when one's available. No phase-timer animation loop is started for a
  // video ride; the video plays at its own pace with normal YouTube controls.
  // The video itself isn't loaded until the kid taps the play button — until
  // then this just shows a real thumbnail with a big obvious play button.
  if (ride.youtubeId){
    canvasWrapEl.style.display = "none";
    videoWrapEl.style.display = "block";
    videoFrameEl.src = "";
    videoFrameEl.style.display = "none";
    videoThumbEl.src = youtubeThumbUrl(ride.youtubeId);
    videoThumbEl.classList.add("show");
    playBtnEl.classList.add("show");
    creditEl.textContent = ride.youtubeCredit || "";
    return;
  }
  canvasWrapEl.style.display = "";
  videoWrapEl.style.display = "none";
  videoFrameEl.src = "";
  videoThumbEl.classList.remove("show");
  playBtnEl.classList.remove("show");

  if (!rideCanvasCtx) rideCanvasCtx = document.getElementById("rideCanvas").getContext("2d");
  if (ride.engine === "track" && !ride._timeline) ride._timeline = buildRideTimeline(ride.heights);
  currentNpcRiders = pickNpcRiders();
  loadPlayerPhotoImage();

  const photoEl = document.getElementById("ridePhotoBg");
  if (ride.photoUrl){
    photoEl.src = ride.photoUrl;
    photoEl.classList.add("show");
    creditEl.textContent = ride.photoCredit || "";
  } else {
    photoEl.classList.remove("show");
    photoEl.removeAttribute("src");
    creditEl.textContent = "";
  }

  rideVisualStartPerf = performance.now();
  if (rideVisualAnimId) cancelAnimationFrame(rideVisualAnimId);
  rideVisualAnimId = requestAnimationFrame(function frame(){
    if (currentRide !== ride) return; // navigated away
    const elapsedSec = (performance.now() - rideVisualStartPerf) / 1000;
    if (ride.photoUrl) drawPhotoRideOverlay(rideCanvasCtx, ride, elapsedSec);
    else if (ride.engine === "wheel") drawWheelRide(rideCanvasCtx, ride, elapsedSec);
    else if (ride.engine === "swing") drawSwingRide(rideCanvasCtx, ride, elapsedSec);
    else if (ride.engine === "drive") drawDriveRide(rideCanvasCtx, ride, elapsedSec);
    else drawTrackRide(rideCanvasCtx, ride, elapsedSec);
    rideVisualAnimId = requestAnimationFrame(frame);
  });
}
function stopRideVisual(){
  if (rideVisualAnimId) cancelAnimationFrame(rideVisualAnimId);
  rideVisualAnimId = null;
  document.getElementById("rideVideoFrame").src = ""; // actually stop playback, don't just hide it
}

var BEACH_RIDES = [ // var (not const) so jsdom tests can reach it via window.BEACH_RIDES
  { id:"wavepool",    name:"Wave Pool", emo:"🌊", color:"#0ea5e9", category:"water", left:"50%", top:"18%",
    engine:"track", theme:"water", loops:noLoops(12),
    heights:[3,4,3,4,3,4,3,4,3,4,3,4] },
  // No dedicated lazy-river POV video exists — this is a general Lagoon-A-
  // Beach tour video, the best real footage available for this attraction.
  { id:"lazyriver",   name:"Lazy River", emo:"🛟", color:"#0d9488", category:"water", left:"18%", top:"30%",
    engine:"drive", theme:"water", scenery:["⛲","🌺","🕳️","🌴","⛲","🌺"],
    youtubeId:"5FF0utFGKpk", youtubeCredit:"Real video: The Coaster Spot (Lagoon-A-Beach tour)" },
  { id:"twistyslide", name:"Twisty Slide", emo:"🌀", color:"#7c3aed", category:"water", left:"82%", top:"30%",
    engine:"track", theme:"splash", loops:loopsAt([3,4],10),
    heights:[2,5,10,15,18,15,10,6,4,2] },
  { id:"cannonball",  name:"Cannonball Cove", emo:"🤿", color:"#1d4ed8", category:"water", left:"20%", top:"78%",
    engine:"track", theme:"splash", loops:noLoops(8),
    heights:[2,4,8,12,16,18,3,3] },
  { id:"splashzone",  name:"Kiddie Splash Zone", emo:"🐳", color:"#fbbf24", category:"mild", left:"80%", top:"78%",
    engine:"track", theme:"water", loops:noLoops(7),
    heights:[2,3,2,3,2,3,2] },
];
const CATEGORY_LABEL = { coaster:"Roller Coaster", water:"Water Ride", sky:"Sky Ride", mild:"Family Ride" };

// Each phase: { text, emo (optional swap), shake (optional), sounds (fn) }
function phasesFor(ride){
  const n = ride.name;
  if (ride.category === "coaster"){
    return [
      { text:`🎢 Climbing up ${n}'s first hill...`, emo:"🎢", sounds:() => slideTone(220, 440, 0, 1.1) },
      { text:"😱 WOOO HOOOO!!! Here we go, DROP!!", emo:"😱", shake:true, scream:true, sounds:() => slideTone(700, 120, 0, 0.5) },
      { text:"🌀 Whoa, loop-de-loop!!", emo:"🌀", shake:true, sounds:() => { tone(500,0,0.12,"triangle",0.15); tone(650,0.12,0.12,"triangle",0.15); tone(500,0.24,0.12,"triangle",0.15); } },
      { text:"💨 Zooming through the turns!!", emo:"💨", shake:true, sounds:() => slideTone(300, 600, 0, 0.5) },
      { text:`🎉 You survived ${n}!! That was awesome!`, emo:"🎉", sounds:() => { tone(660,0,0.15,"sine",0.16); tone(880,0.12,0.2,"sine",0.16); } },
    ];
  }
  if (ride.category === "water"){
    return [
      { text:`💦 Floating along ${n}...`, emo:"💦", sounds:() => tone(400, 0, 0.6, "sine", 0.1) },
      { text:"🌊 Uh oh, big splash ahead!!", emo:"🌊", sounds:() => slideTone(300, 500, 0, 0.6) },
      { text:"💧 SPLASH!! You're soaked!", emo:"💧", shake:true, sounds:() => { tone(200,0,0.2,"sine",0.18); tone(150,0.1,0.25,"sine",0.15); } },
      { text:`🎉 That was so much fun on ${n}!`, emo:"🎉", sounds:() => { tone(660,0,0.15,"sine",0.16); tone(880,0.12,0.2,"sine",0.16); } },
    ];
  }
  if (ride.category === "sky"){
    return [
      { text:`🪂 Rising up high on ${n}...`, emo:"🪂", sounds:() => slideTone(250, 500, 0, 1.0) },
      { text:"😲 Whoa, look how high up we are!", emo:"😲", sounds:() => tone(700, 0, 0.4, "sine", 0.12) },
      { text:"🕊️ WOOO HOOOO!!! Free fall!!", emo:"🕊️", shake:true, scream:true, sounds:() => slideTone(650, 150, 0, 0.6) },
      { text:`🎉 What a rush on ${n}!!`, emo:"🎉", sounds:() => { tone(660,0,0.15,"sine",0.16); tone(880,0.12,0.2,"sine",0.16); } },
    ];
  }
  // mild
  return [
    { text:`🎠 Hopping on ${n}...`, emo:"🎠", sounds:() => tone(500, 0, 0.4, "sine", 0.1) },
    { text:"😊 This is so relaxing and fun!", emo:"😊", sounds:() => tone(600, 0, 0.4, "sine", 0.1) },
    { text:`🎉 That was a nice ride on ${n}!`, emo:"🎉", sounds:() => { tone(660,0,0.15,"sine",0.16); tone(880,0.12,0.2,"sine",0.16); } },
  ];
}

function renderRideMap(rides, layerId){
  const layer = document.getElementById(layerId);
  layer.innerHTML = "";
  rides.forEach(ride => {
    const pin = document.createElement("button");
    pin.className = "ride-pin";
    pin.style.left = ride.left;
    pin.style.top = ride.top;
    pin.innerHTML = `<div class="ride-pin-icon" style="background:${ride.color}">${ride.emo}</div>
      <div class="ride-pin-label">${ride.name}</div>`;
    pin.addEventListener("click", () => startRide(ride));
    layer.appendChild(pin);
  });
}

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById("screen-" + id).classList.add("active");
}
document.getElementById("goToBeachBtn").addEventListener("click", () => {
  tone(500, 0, 0.1, "triangle", 0.1);
  showScreen("beach");
});
document.getElementById("goToParkBtn").addEventListener("click", () => {
  tone(500, 0, 0.1, "triangle", 0.1);
  showScreen("park");
});

let rideTimeout = null;
var currentRide = null; // var (not let) so jsdom tests can reach it via window.currentRide
let rideOrigin = "park"; // which map screen to return to when the ride ends

function startRide(ride){
  currentRide = ride;
  rideOrigin = document.getElementById("screen-beach").classList.contains("active") ? "beach" : "park";
  showScreen("ride");
  document.getElementById("rideViewName").textContent = ride.name;
  document.getElementById("rideDoneRow").style.display = "none";
  document.getElementById("rideBackBtn").textContent = rideOrigin === "beach" ? "🏖️ Back to Beach" : "🏠 Back to Park";
  initRideVisual(ride);
  if (ride.youtubeId){
    // A real video runs way longer than the ~6-10s phase-caption sequence
    // below, so it doesn't apply here — just show a simple caption and let
    // the kid leave (or replay) whenever they want instead of a forced wait.
    clearTimeout(rideTimeout);
    document.getElementById("rideView").classList.remove("shaking");
    document.getElementById("ridePhaseText").textContent = `🎥 Watch the real ${ride.name}!`;
    document.getElementById("rideDoneRow").style.display = "flex";
  } else {
    playPhases(ride);
  }
}

function playPhases(ride){
  const phases = phasesFor(ride);
  const view = document.getElementById("rideView");
  const badgeEl = document.getElementById("rideBigEmo");
  const textEl = document.getElementById("ridePhaseText");
  view.classList.remove("shaking");
  clearTimeout(rideTimeout);

  let i = 0;
  function step(){
    if (currentRide !== ride) return; // navigated away mid-sequence
    const phase = phases[i];
    badgeEl.textContent = phase.emo || ride.emo;
    textEl.textContent = phase.text;
    view.classList.toggle("shaking", !!phase.shake);
    badgeEl.classList.toggle("screaming", !!phase.scream);
    if (phase.sounds) phase.sounds();
    i++;
    if (i < phases.length){
      rideTimeout = setTimeout(step, 1500);
    } else {
      rideTimeout = setTimeout(() => {
        if (currentRide !== ride) return;
        view.classList.remove("shaking");
        document.getElementById("rideDoneRow").style.display = "flex";
      }, 1500);
    }
  }
  step();
}

document.getElementById("videoPlayBtn").addEventListener("click", () => {
  if (!currentRide || !currentRide.youtubeId) return;
  tone(600, 0, 0.1, "triangle", 0.1);
  document.getElementById("rideVideoThumb").classList.remove("show");
  document.getElementById("videoPlayBtn").classList.remove("show");
  const videoFrameEl = document.getElementById("rideVideoFrame");
  videoFrameEl.style.display = "block";
  videoFrameEl.src = youtubeEmbedUrl(currentRide.youtubeId, true); // a real tap just happened, so autoplay is allowed
});
document.getElementById("rideAgainBtn").addEventListener("click", () => {
  if (!currentRide) return;
  document.getElementById("rideDoneRow").style.display = "none";
  initRideVisual(currentRide); // for a video ride this also restarts it from the beginning
  if (currentRide.youtubeId){
    document.getElementById("ridePhaseText").textContent = `🎥 Watch the real ${currentRide.name}!`;
    document.getElementById("rideDoneRow").style.display = "flex";
  } else {
    playPhases(currentRide);
  }
});
document.getElementById("rideBackBtn").addEventListener("click", () => {
  clearTimeout(rideTimeout);
  stopRideVisual();
  currentRide = null;
  document.getElementById("rideView").classList.remove("shaking");
  showScreen(rideOrigin);
});

renderRideMap(RIDES, "ridePinsLayer");
renderRideMap(BEACH_RIDES, "beachPinsLayer");
</script>
</body>
</html>
